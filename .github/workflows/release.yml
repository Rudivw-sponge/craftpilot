name: Release

# Builds the Windows installer and portable exe and attaches them to a GitHub
# Release whenever a version tag (v*) is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag, package.json and the plugin manifest must carry the same version.
      - run: node scripts/check-version.js

      - run: npm run dist

      - name: Attach builds to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
          # Versions before 1.0 are betas: mark their releases as pre-releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
